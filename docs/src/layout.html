<title>Claude Relay 設計規格</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: sticky left index (desktop) + single reading column; collapses to a top index on phones.
   Palette: dispatch-board neutrals biased toward green-grey, one teal "signal" accent, amber for attention. */
:root {
  --bg: #f4f6f4;
  --surface: #ffffff;
  --surface-2: #eaeeea;
  --fg: #18201c;
  --muted: #56615b;
  --line: #d3dad5;
  --accent: #0d6b5b;
  --accent-soft: #d8ece6;
  --amber: #a35a06;
  --amber-soft: #f6e7d2;
  --ok: #2c7a3f;
  --bad: #b3312b;
  --code-bg: #edf1ee;
  --font-body: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  --font-head: "IBM Plex Sans Condensed", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", "Cascadia Mono", Consolas, "Noto Sans TC", monospace;
  --step--1: 0.8125rem;
  --step-0: 0.9375rem;
  --step-1: 1.125rem;
  --step-2: 1.375rem;
  --step-3: 1.875rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --surface: #18201c; --surface-2: #1f2924; --fg: #e2e8e4; --muted: #98a59e;
    --line: #2d3832; --accent: #4fc2a7; --accent-soft: #173a31; --amber: #e3a04e; --amber-soft: #3a2a14;
    --ok: #6cc784; --bad: #ef7d74; --code-bg: #0d120f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --surface: #18201c; --surface-2: #1f2924; --fg: #e2e8e4; --muted: #98a59e;
  --line: #2d3832; --accent: #4fc2a7; --accent-soft: #173a31; --amber: #e3a04e; --amber-soft: #3a2a14;
  --ok: #6cc784; --bad: #ef7d74; --code-bg: #0d120f; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 16px; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: var(--step-0); line-height: 1.75;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 40px; max-width: 1240px; margin: 0 auto; padding-block: 32px 80px; }
nav.toc { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; max-height: 100vh; overflow-y: auto; padding-block: 8px 24px; }
nav.toc .brand { font-family: var(--font-head); font-weight: 600; font-size: var(--step-1); letter-spacing: 0.01em; display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
nav.toc .brand svg { flex: none; }
nav.toc .ver { font-family: var(--font-mono); font-size: var(--step--1); color: var(--muted); margin-bottom: 16px; }
nav.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; counter-reset: toc; }
nav.toc li { counter-increment: toc; }
nav.toc li.group { counter-increment: none; }
nav.toc a { display: grid; grid-template-columns: 2.2em 1fr; padding: 4px 8px; border-radius: 6px; color: var(--muted); text-decoration: none; font-size: var(--step--1); line-height: 1.5; }
nav.toc a::before { content: counter(toc, decimal-leading-zero); font-family: var(--font-mono); opacity: 0.7; }
nav.toc a:hover { color: var(--fg); background: var(--surface-2); }
nav.toc a.active { color: var(--accent); background: var(--accent-soft); font-weight: 500; }
nav.toc .group { font-family: var(--font-head); text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.7rem; color: var(--muted); margin: 14px 8px 4px; }
main { min-width: 0; }
header.doc { border-bottom: 1px solid var(--line); padding-bottom: 24px; margin-bottom: 8px; }
.eyebrow { font-family: var(--font-head); text-transform: uppercase; letter-spacing: 0.1em; font-size: var(--step--1); color: var(--accent); font-weight: 600; }
h1 { font-family: var(--font-head); font-size: var(--step-3); line-height: 1.25; margin: 6px 0 12px; text-wrap: balance; font-weight: 600; }
h2 { font-family: var(--font-head); font-size: var(--step-2); line-height: 1.3; margin: 0 0 12px; text-wrap: balance; font-weight: 600; display: flex; gap: 12px; align-items: baseline; }
h2 .no { font-family: var(--font-mono); font-size: var(--step-0); color: var(--accent); font-weight: 500; }
h3 { font-size: var(--step-1); margin: 28px 0 8px; line-height: 1.4; text-wrap: balance; }
h4 { font-size: var(--step-0); margin: 20px 0 6px; }
section { padding-block: 40px 8px; border-bottom: 1px solid var(--line); }
section:last-of-type { border-bottom: 0; }
p, li { max-width: 72ch; }
p { margin: 0 0 12px; }
ul, ol { padding-left: 1.4em; margin: 0 0 12px; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code { font-family: var(--font-mono); font-size: 0.86em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.codebox { position: relative; margin: 8px 0 16px; }
.codebox .label { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 12px; background: var(--surface-2); border: 1px solid var(--line); border-bottom: 0; border-radius: 8px 8px 0 0; }
.codebox .label button { font: inherit; color: var(--accent); background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: 1px 8px; cursor: pointer; }
pre { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 0 0 8px 8px; padding: 12px 14px; overflow-x: auto; font-family: var(--font-mono); font-size: 0.8rem; line-height: 1.6; tab-size: 2; }
pre code { background: none; padding: 0; font-size: inherit; overflow-wrap: normal; }
.tablewrap { overflow-x: auto; margin: 8px 0 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: var(--step--1); line-height: 1.6; }
th, td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--line); }
th { font-family: var(--font-head); font-weight: 600; background: var(--surface-2); white-space: nowrap; letter-spacing: 0.02em; }
tr:last-child td { border-bottom: 0; }
td code { white-space: nowrap; }
td.wrap code { white-space: normal; }
table.matrix td:first-child { font-weight: 500; white-space: nowrap; }
table.matrix td code { white-space: normal; }
.num { font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
.note { border: 1px solid var(--line); border-left: 4px solid var(--accent); background: var(--surface); border-radius: 6px; padding: 10px 14px; margin: 12px 0 16px; max-width: 80ch; }
.note.warn { border-left-color: var(--amber); background: var(--amber-soft); }
.note b:first-child { font-family: var(--font-head); letter-spacing: 0.02em; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin: 12px 0 18px; }
.card { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.card h4 { margin: 0 0 6px; font-family: var(--font-head); font-size: var(--step-1); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.card h4 .tag { font-family: var(--font-mono); font-size: 0.7rem; color: var(--accent); font-weight: 500; }
.card p, .card li { font-size: var(--step--1); }
.card ul { margin: 0; }
.pill { display: inline-block; font-family: var(--font-mono); font-size: 0.72rem; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; line-height: 1.7; }
.pill.ok { color: var(--ok); border-color: currentColor; background: transparent; }
.pill.bad { color: var(--bad); border-color: currentColor; background: transparent; }
.pill.wait { color: var(--amber); border-color: currentColor; background: transparent; }
.pill.run { color: var(--accent); border-color: currentColor; background: transparent; }
.method { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 500; padding: 0 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.method.post { background: var(--amber-soft); color: var(--amber); }
figure { margin: 12px 0 20px; }
figure .svgwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 12px; }
figure svg { display: block; min-width: 760px; width: 100%; height: auto; }
figcaption { font-size: var(--step--1); color: var(--muted); margin-top: 6px; }
svg text { font-family: var(--font-body); fill: var(--fg); }
svg .t-title { font-family: var(--font-head); font-weight: 600; font-size: 14px; }
svg .t-box { font-size: 12.5px; font-weight: 500; }
svg .t-sub { font-size: 11px; fill: var(--muted); }
svg .t-edge { font-size: 11px; fill: var(--accent); font-family: var(--font-mono); }
svg .g-machine { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.2; }
svg .g-hub { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.4; }
svg .g-box { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
svg .g-person { fill: var(--amber-soft); stroke: var(--amber); stroke-width: 1.2; }
svg .g-edge { stroke: var(--accent); stroke-width: 1.6; fill: none; }
svg .g-edge-in { stroke: var(--muted); stroke-width: 1.2; fill: none; }
svg .g-edge-dash { stroke: var(--muted); stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
svg .head-a { fill: var(--accent); }
svg .head-m { fill: var(--muted); }
svg .s-state { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
svg .s-terminal { fill: var(--surface-2); stroke: var(--fg); stroke-width: 1.6; }
svg .s-wait { fill: var(--amber-soft); stroke: var(--amber); stroke-width: 1.2; }
svg .s-run { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
details { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); margin: 10px 0 16px; }
details > summary { cursor: pointer; padding: 10px 14px; font-weight: 500; }
details[open] > summary { border-bottom: 1px solid var(--line); }
details > .inner { padding: 4px 14px 6px; }
details > .inner .codebox { margin-top: 10px; }
.steps { counter-reset: st; list-style: none; padding: 0; display: grid; gap: 0; margin: 8px 0 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; }
.steps li { counter-increment: st; display: grid; grid-template-columns: 2.6em minmax(0, 1fr); gap: 8px; padding: 9px 14px; border-bottom: 1px solid var(--line); max-width: none; font-size: var(--step--1); }
.steps li:last-child { border-bottom: 0; }
.steps li::before { content: counter(st); font-family: var(--font-mono); color: var(--accent); font-weight: 500; }
.steps .who { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }
.lede { font-size: var(--step-1); color: var(--muted); max-width: 64ch; }
.meta-row { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: var(--step--1); color: var(--muted); margin-top: 12px; }
.meta-row span b { color: var(--fg); font-weight: 500; }
@media (max-width: 980px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; padding-block: 16px 60px; }
  nav.toc { position: static; max-height: none; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 12px; margin-bottom: 8px; }
  nav.toc ol { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  nav.toc .group { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<div class="shell">
<nav class="toc" aria-label="目錄">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="4" cy="11" r="3" fill="var(--accent)"/><circle cx="18" cy="5" r="3" fill="var(--accent)"/><circle cx="18" cy="17" r="3" fill="var(--accent)"/><path d="M6.5 10 L15.5 6 M6.5 12 L15.5 16" stroke="var(--accent)" stroke-width="1.6"/></svg>
    Claude Relay
  </div>
  <div class="ver">relay/1.0 · 設計 {{DOC_VERSION}}</div>
  <ol>
{{TOC}}
  </ol>
</nav>

<main>
{{HEADER}}

{{SECTIONS}}
</main>
</div>

<script>
(function () {
  // Copy buttons: copy the <pre> text of the same code box.
  document.querySelectorAll('[data-copy]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var pre = btn.closest('.codebox').querySelector('pre');
      var text = pre.innerText;
      var done = function () { btn.textContent = '已複製'; setTimeout(function () { btn.textContent = '複製'; }, 1500); };
      var fallback = function () {
        var r = document.createRange(); r.selectNodeContents(pre);
        var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        btn.textContent = '已選取，請按 Ctrl+C';
      };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
        else fallback();
      } catch (e) { fallback(); }
    });
  });
  // Highlight the current section in the index.
  var links = {};
  document.querySelectorAll('nav.toc a[href^="#"]').forEach(function (a) { links[a.getAttribute('href').slice(1)] = a; });
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting && links[en.target.id]) {
          Object.keys(links).forEach(function (k) { links[k].classList.remove('active'); });
          links[en.target.id].classList.add('active');
        }
      });
    }, { rootMargin: '-10% 0px -80% 0px' });
    document.querySelectorAll('main section[id]').forEach(function (s) { io.observe(s); });
  }
})();
</script>
