<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIPager Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#home">AIPager</a>
  <nav id="nav">
    <a href="#home" data-i18n="nav.home">首頁</a>
    <a href="#nodes" data-i18n="nav.nodes">節點</a>
    <a href="#tasks" data-i18n="nav.tasks">任務</a>
    <a href="#approvals" data-i18n="nav.approvals">審核</a>
    <a href="#enroll" data-i18n="nav.enroll">新增機器</a>
  </nav>
  <div class="tools">
    <span id="live" class="live" title="SSE"></span>
    <select id="lang" aria-label="language"><option value="zh-TW">中文</option><option value="en">English</option></select>
    <button id="logout" type="button" data-i18n="logout">登出</button>
  </div>
</header>
<main id="app"><p class="muted">Loading…</p></main>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
